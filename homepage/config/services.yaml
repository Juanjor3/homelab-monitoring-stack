- Observability:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://localhost:3001
        description: HTTP, TCP & Docker availability checks
        server: local-docker
        container: uptime-kuma

    - Dozzle:
        icon: dozzle.png
        href: http://localhost:8888
        description: Real-time container log viewer
        server: local-docker
        container: dozzle

    - Docker CVE Radar:
        icon: mdi-shield-check
        href: http://localhost:8090
        description: Multi-source CVE & container stack audit
        widget:
          type: customapi
          url: http://host.docker.internal:8090/api/summary
          mappings:
            - field: status
              label: Status
            - field: containers
              label: Containers
            - field: catalog
              label: Threat Intel

- Core Services:
    - Reverse Proxy (Traefik):
        icon: traefik.png
        href: http://localhost:8080
        description: Edge routing & TLS termination

    - PostgreSQL:
        icon: postgres.png
        description: Primary relational database engine

    - Redis Cache:
        icon: redis.png
        description: In-memory cache & session store
